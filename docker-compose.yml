volumes:
  pg_volume_dev: {}

services:
  pg-dev:
    image: bitnami/postgresql:latest
    container_name: infosec-pg-dev
    environment:
      POSTGRESQL_DATABASE: pg-dev
      POSTGRESQL_USERNAME: dev-username
      POSTGRESQL_PASSWORD: dev-password
    volumes:
      - pg_volume_dev:/bitnami/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "$$POSTGRESQL_USERNAME" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
