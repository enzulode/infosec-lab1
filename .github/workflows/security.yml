name: security
on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, edited ]
    branches: [ master ]

jobs:
  spotbugs-sast:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Build with Gradle
        continue-on-error: true
        run: ./gradlew check
      - name: Spotbugs report upload
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-html
          path: build/reports/spotbugs/spotbugs-report.html
          retention-days: 30

  snyk-sca:
    runs-on: ubuntu-latest
    needs: spotbugs-sast
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@master
      - name: Snyk Check
        uses: snyk/actions/gradle-9-jdk21@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}
        with:
          args: --all-sub-projects --json-file-output=snyk-results.json
      - name: Setup Node (for snyk-to-html)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Snyk CLI and snyk-to-html
        run: |
          npm install -g snyk snyk-to-html
      - name: Generate Snyk HTML report
        run: |
          snyk-to-html -i snyk-results.json -o snyk-report.html
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}

      - name: Snyk report upload
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-html
          path: snyk-report.html
          retention-days: 30
